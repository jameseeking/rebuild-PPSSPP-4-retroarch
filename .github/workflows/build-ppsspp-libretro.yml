name: Build PPSSPP v1.19.3 Libretro Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Clone PPSSPP v1.19.3 with submodules
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git clone --branch v1.19.3 --recursive https://github.com/hrydgard/ppsspp.git ppsspp
          cd ppsspp
          git submodule update --init --recursive
          git status --short

      - name: Configure CMake for Libretro
        shell: pwsh
        run: |
          cmake -S ppsspp -B build -G "Visual Studio 17 2022" -A x64 `
            -DLIBRETRO=ON `
            -DUSE_DISCORD=OFF `
            -DHEADLESS=OFF `
            -DUNITTEST=OFF

      - name: Build ppsspp_libretro.dll
        shell: pwsh
        run: |
          cmake --build build --config Release --target ppsspp_libretro -- /m:2

      - name: Locate and verify output
        id: locate
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter ppsspp_libretro.dll | Select-Object -First 1
          if (!$dll) {
            throw "ppsspp_libretro.dll was not produced"
          }
          Write-Host "Found: $($dll.FullName)"
          Get-Item $dll.FullName | Format-List Name,Length,LastWriteTime
          "dll_path=$($dll.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload ppsspp_libretro.dll
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-libretro-v1.19.3-windows-x64
          path: ${{ steps.locate.outputs.dll_path }}
          if-no-files-found: error
          retention-days: 30
